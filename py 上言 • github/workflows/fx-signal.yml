name: FX Signal Notifier

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'テスト通知を送る（LINE/メールの疎通確認）'
        type: boolean
        default: false

permissions:
  contents: write          # positions.json / status.json を自動更新するため

concurrency:
  group: fx-signal
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run signal & position check
        env:
          TEST_NOTIFY:               ${{ inputs.test }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GMAIL_ADDRESS:             ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:        ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO:                   ${{ secrets.MAIL_TO }}
        run: python fx_signal.py
      - name: Commit dashboard state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add positions.json status.json
          git diff --staged --quiet || (git commit -m "auto: update state [skip ci]" && git push)
