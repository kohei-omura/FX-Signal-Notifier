# ===== 株オラクル 設定ファイル =====
# これを config.yaml にコピーして編集してください（config.yaml は .gitignore 済み）

# 場中の push 通知(intraday-watch)の対象銘柄。
# ※ダッシュボードの「マイ銘柄」はブラウザ保存で、これとは別物です。
#   LINE/メールでも知らせてほしい銘柄ができたら、下に追記してください。
#   例:
#   watchlist:
#     - 7203   # トヨタ自動車
watchlist: []

# ランキング対象ユニバース（code,name,market の CSV）
universe_file: universe_all.csv

# 対象とする市場区分（安定志向なら prime 推奨）
#   all       … 全銘柄（プライム＋スタンダード＋グロース 約3,734）
#   prime     … プライムのみ（大型・中型 約1,564／値動き安定）
#   standard  … スタンダードのみ
#   growth    … グロースのみ（新興・小型／値動き激しい）
#   複数指定も可（例: prime,standard）
markets: all

# ランキング表示件数（買い・売り 各 Top-N）
top_n: 5

# 相対力の基準（^N225 = 日経平均, ^TPX = TOPIX）
benchmark: "^N225"

# シグナル閾値
thresholds:
  rsi_oversold: 30        # これ以下で売られすぎ
  rsi_overbought: 70      # これ以上で買われすぎ
  atr_stop_mult: 2.0      # 損切り = 取得値 - ATR×この倍率
  atr_target_mult: 3.0    # 利確   = 取得値 + ATR×この倍率

# ===== テクニカル × ファンダメンタル複合ランキング（J-Quants V2 無料枠）=====
# enabled: true で有効。GitHub Secrets に JQUANTS_API_KEY を登録してください。
# （V2はAPIキー方式。J-Quantsダッシュボードで発行。メール/パスワード方式は廃止）
# キーが無い/失敗時は自動でテクニカルのみに切替（壊れません）。
# 無料枠は「毎分5リクエスト・過去2年・約12週間遅延」。財務は変化が遅いので実用上OK。
# 毎分5件制限のため、テクニカル上位 screen_top 銘柄だけを request_sleep 秒間隔で取得します。
fundamentals:
  enabled: true
  weight_tech: 0.5        # 複合スコアにおけるテクニカルの比重
  weight_fund: 0.5        # 同・ファンダの比重
  screen_top: 15          # テクニカル上位この件数にだけ財務を付与（多いほど時間がかかる）
  request_sleep: 13       # 1銘柄ごとの待機秒（無料枠=毎分5件 → 13秒が安全）
  fair_per: 15            # 理論株価の収益基準PER（標準的な水準）
  fair_return: 0.08       # 理論株価の期待利回り（ROE基準の割引率）
  # 指標の重み（合計は自動正規化。小さいPER/PBR=高評価、ROE/自己資本比率/利回り/増益=高評価）
  metric_weights:
    per: 0.25
    pbr: 0.15
    roe: 0.25
    eqr: 0.10
    divy: 0.10
    growth: 0.15
