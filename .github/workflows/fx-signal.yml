name: FX Signal Notifier

on:
  push:
    paths:
      - 'positions.json'    # ポジションを編集したら即実行（自動利確レベル設定＆通知）
  workflow_dispatch:
    inputs:
      test:
        description: 'テスト通知を送る（LINE/メールの疎通確認）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fx-signal
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run signal & position check
        env:
          TEST_NOTIFY:               ${{ inputs.test }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GMAIL_ADDRESS:             ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:        ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO:                   ${{ secrets.MAIL_TO }}
        run: python fx_signal.py
      - name: Commit dashboard state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json positions.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: update state [skip ci]"
          # 通知は前ステップで送信済み。状態保存(status.json)が競合しても“失敗にしない”。
          # 競合時はアプリ側(リモートのpositions.json=追加/決済)を優先し、今回の保存は見送る（次回再生成）。
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # rebaseでは -X ours = 取り込み先(リモート)側を優先＝アプリの編集を保護
            if git rebase -X ours "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "pushed"; exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
              git reset --hard "origin/${GITHUB_REF_NAME}"
              echo "conflict: skip state save this cycle (regenerates next run)"; exit 0
            fi
            echo "push retry $i"; sleep 4
          done
          echo "push contended; skip this cycle"; exit 0
