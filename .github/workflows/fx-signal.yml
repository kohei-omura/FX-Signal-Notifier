# .github/workflows/（あなたのPagesデプロイ用YAML）を、これで置き換えてください。
# 変更点は2つだけ：
#  ① concurrency に cancel-in-progress: true  → 二重デプロイの衝突(400エラー)を解消
#  ② on.push.paths-ignore で status.json / positions.json / mode.json を除外
#     → 通知ボットの自動コミットでPagesデプロイがムダにトリガーされるのStop（衝突の根本原因）
#
# ※ ファイル名は今お使いのものに合わせてOK（例: deploy.yml / pages.yml / static.yml）。
#    中身を丸ごとこの内容に置き換えるのが安全です。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'status.json'      # 通知ボットが毎回更新するファイル。これでのデプロイは不要
      - 'positions.json'   # アプリの追加/決済。Pages再デプロイは不要
      - 'mode.json'         # スタイル切替。Pages再デプロイは不要
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同じグループのデプロイは1つだけ。新しいデプロイが来たら進行中を自動キャンセル＝衝突しない
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # リポジトリ直下を公開（今の構成に合わせて変更可）
      - id: deployment
        uses: actions/deploy-pages@v5
