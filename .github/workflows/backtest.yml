name: Long Backtest

# 判定に優位性があるのかを判断するための長期検証。
# status.json に載る統計は直近8日ぶんしかなく、4通貨とも円クロスで相関するため
# 実質の独立サンプルが少ない。期間を延ばして1日1回だけ集計し直す。
# 5分ごとの通知ワークフローとは分離してあるので通知の実行時間には影響しない。

on:
  schedule:
    - cron: '30 20 * * *'   # 毎日 05:30 JST（20:30 UTC）。ニュース取得(06:00 JST)と時間をずらす
  workflow_dispatch:
    inputs:
      modes:
        description: '集計するモード（例: day / scalp,day,swing）'
        type: string
        default: 'scalp,day,swing'

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run long backtest
        env:
          BACKTEST_MODES: ${{ inputs.modes || 'scalp,day,swing' }}
        run: python backtest.py
      - name: Commit backtest.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: update backtest [skip ci]"
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
              git reset --hard "origin/${GITHUB_REF_NAME}"
              echo "conflict: skip this cycle"; exit 0
            fi
            echo "push retry $i"; sleep 4
          done
          echo "push contended; skip"; exit 0
